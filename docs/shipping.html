<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>出船管理 ／ 検査仕様 打合せサイト</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="topbar">
    <div>
      <h1 data-i18n="shipping_title">出船管理</h1>
      <div class="subtitle" data-i18n="shipping_subtitle">HTW検査スケジュールと出荷船便の一覧</div>
    </div>
    <div class="topbar-actions">
      <a class="lang-btn" href="index.html" data-i18n="back">一覧に戻る</a>
      <button class="lang-btn" data-lang-toggle onclick="I18N.toggle()">中文</button>
      <a class="lang-btn" href="#" data-logout data-i18n="logout">ログアウト</a>
    </div>
  </div>

  <div class="container container-wide">
    <input
      id="search"
      class="search-box"
      type="search"
      data-i18n-placeholder="shipping_search_placeholder"
      placeholder="得意先・品番・発注No で検索"
    />
    <div class="item-count" id="shipmentCount"></div>

    <details class="schedule-details">
      <summary data-i18n="schedule_summary">船期表を見る（参考）</summary>
      <div id="scheduleTable" class="schedule-table"></div>
    </details>

    <details id="newOrderDetails" class="new-order-details">
      <summary data-i18n="new_order_summary">＋ 新しい注文を追加</summary>
      <form id="newOrderForm" class="new-order-form">
        <label>
          <span data-i18n="ship_col_customer">得意先</span>
          <input type="text" id="newCustomer" />
        </label>
        <label>
          <span data-i18n="ship_col_partno">品番</span>
          <input type="text" id="newPartNo" />
        </label>
        <label>
          <span data-i18n="ship_col_order_no">発注No</span>
          <input type="text" id="newOrderNo" required />
        </label>
        <label>
          <span data-i18n="ship_col_line_no">行No</span>
          <input type="text" id="newLineNo" required />
        </label>
        <label>
          <span data-i18n="ship_col_order_qty">発注数量</span>
          <input type="number" id="newOrderQty" />
        </label>
        <label>
          <span data-i18n="ship_col_delivery_type">納品種別(分納)</span>
          <input type="text" id="newDeliveryType" />
        </label>
        <label>
          <span data-i18n="ship_col_due">発注納期</span>
          <input type="date" id="newOrderDueDate" />
        </label>
        <button type="submit" data-i18n="new_order_submit">追加する</button>
        <div id="newOrderMsg" class="form-msg"></div>
      </form>
    </details>

    <div id="shipmentTableWrap"></div>
    <div class="footer-note" data-i18n="footer_note"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="auth.js"></script>
  <script src="shipment-seen.js"></script>
  <script src="shipping.js"></script>
</body>
</html>
